spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/pmDatabase?sslMode=disable
    username: root
    password: password
  data:
    redis:
      host: localhost
      port: 6379
      password:
jwt:
  secret: ${JWT_SECRET:myVerySecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
