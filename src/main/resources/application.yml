spring:
  application:
    name: BACKEND
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health
jwt:
  secret: ${JWT_SECRET:myVerySecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}       # 15분
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000} # 30일
  magic-link-expiration: ${JWT_MAGIC_EXPIRATION:600000}          # 10분
verification:
  code-expiration: ${VERIFICATION_CODE_EXPIRATION:60000}          # 1분 (인증코드 만료기간)
logging:
  level:
    backend: DEBUG
    org.springframework.r2dbc: DEBUG
