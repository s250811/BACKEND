name: Blue-Green Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Jar
        run: ./gradlew clean build -x test

      - name: Docker Build
        run: docker build -t yikanghee2/myapp:latest .

      # 1. Docker Hub 로그인
      - name: Docker Login
        run: echo "${{ secrets.DOCKERHUB_DEV_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_DEV_USERNAME }}" --password-stdin

      # 2. Docker 이미지 빌드
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_DEV_USERNAME }}/myapp:latest .

      # 3. Docker 이미지 푸시
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_DEV_USERNAME }}/myapp:latest

      # 4. EC2로 SSH 접속 & 배포 스크립트 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /etc/nginx/deploy
            ./deploy.sh
